<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvelous Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080816;
            color: white;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%, #8b5cf655, transparent 30%),
                radial-gradient(circle at 85% 20%, #06b6d455, transparent 30%),
                radial-gradient(circle at 50% 90%, #ec489955, transparent 35%),
                #11112b;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border: 2px solid #67e8f955;
            border-radius: 50%;
            top: -100px;
            right: -70px;
            box-shadow:
                0 0 0 30px #8b5cf522,
                0 0 0 60px #06b6d511;
            animation: rotate 12s linear infinite;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: #ec489933;
            border-radius: 35% 65% 60% 40%;
            bottom: -70px;
            left: -50px;
            transform: rotate(25deg);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }

        .hero img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 24px;
            border: 4px solid white;
            box-shadow: 0 0 35px #67e8f988;
            margin-bottom: 25px;
            animation: float 4s ease-in-out infinite;
        }

        .hero h1 {
            font-size: 3.2rem;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #67e8f9;
        }

        .hero p {
            color: #d7d9e8;
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            border-radius: 40px;
            background: linear-gradient(45deg, #06b6d4, #8b5cf6, #ec4899);
            color: white;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 10px 30px #8b5cf655;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px #67e8f9aa;
        }

        @keyframes float {
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.3rem;
            }

            .hero img {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-content">

            <img src="webdev.png" alt="Web Development Image">

            <h1>Hi, I'm <span>Marvelous</span></h1>

            <p>
                A student passionate about technology, web development,
                creative design and building digital experiences that stand out.
            </p>

            <a href="#work" class="btn">Explore My Work</a>

        </div>
    </section>

</body>
</html>
